<mat-expansion-panel [expanded]="credits.length > 0">
  <mat-expansion-panel-header class="dark-theme">
    <mat-panel-title>
      Credits
    </mat-panel-title>

  </mat-expansion-panel-header>

  <app-credits-table></app-credits-table>
  <mat-action-row>
    @if (credits.length > 0) {
      <button mat-button (click)="delete()">Delete</button>
    }
    <button mat-button (click)="update()">Update</button>
  </mat-action-row>
</mat-expansion-panel>
