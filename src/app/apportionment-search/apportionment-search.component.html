<form [formGroup]="searchForm">
  <mat-form-field class="example-full-width">
    <mat-label>Address, account ID, premise ID</mat-label>

    <input
      (input)="inputChanged($event)"
      matInput
      placeholder="Address, account ID, premise ID"
      aria-label="State"
      formControlName="searchGroup"
      [formControl]="control"
      [matAutocomplete]="searchGroup"
    />
    <mat-autocomplete
      #searchGroup="matAutocomplete"
      (optionSelected)="accountSelected($event)"
      [displayWith]="displayFn"
    >
      @for (group of searchGroups; track group.type) {
        <mat-optgroup [label]="group.type">
          @for (item of group.values; track item) {
            <mat-option [value]="item">
              {{ item }}
            </mat-option>
          }
        </mat-optgroup>
      }
    </mat-autocomplete>
  </mat-form-field>
</form>
